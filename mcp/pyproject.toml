[project]
name = "antiprint-mcp"
version = "0.1.0"
description = "AntiPrint 管理端 MCP Server（任务审核 / 交接 / 用户 / 设置）"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2.0,<2", "httpx>=0.27"]

[project.scripts]
antiprint-mcp = "antiprint_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["antiprint_mcp"]
