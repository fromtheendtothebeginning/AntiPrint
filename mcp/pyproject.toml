[project]
name = "antiprint-mcp"
version = "0.1.0"
description = "AntiPrint MCP Server（用户端：查询 / 提交 / 充值；管理端：提交 / 审核 / 交接 / 用户 / 设置）"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2.0,<2", "httpx>=0.27"]

[project.scripts]
antiprint-mcp = "antiprint_mcp.server:main"
antiprint-user-mcp = "antiprint_mcp.user_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["antiprint_mcp"]
