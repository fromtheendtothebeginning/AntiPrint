# AntiPrint 远程打印服务 —— FastAPI 单进程同时托管 API 与前端 dist（127.0.0.1:8301）
# 部署位置：服务器 /etc/nginx/sites-available/antiprint（软链到 sites-enabled 启用）
# 启用：ln -sf /etc/nginx/sites-available/antiprint /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# 证书：certbot --nginx -d print.anticraft.top（需 DNS 已解析到本机）
server {
    listen 80;
    server_name print.anticraft.top;

    client_max_body_size 60m;   # 单任务最多 5 个 ≤10MB 文件，留足余量

    location / {
        proxy_pass http://127.0.0.1:8301;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
